# Preserve the original scheme from a trusted outer TLS proxy. Unknown or
# malformed values fall back to the scheme used for this Nginx hop.
map $http_x_forwarded_proto $xinyue_forwarded_proto {
  default $scheme;
  "http" http;
  "https" https;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  absolute_redirect off;

  client_max_body_size 55m;
  include /etc/nginx/snippets/security-headers.conf;

  # Keep the API namespace ahead of the SPA fallback. The exact and ^~
  # locations make a typo or a future regex location unable to send API
  # requests to index.html.
  location = /v1 {
    proxy_pass http://backend:3100;
    proxy_http_version 1.1;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_intercept_errors off;
    add_header Cache-Control "no-store" always;
    add_header X-Accel-Buffering "no" always;
    # A location-level add_header block does not inherit the server headers.
    include /etc/nginx/snippets/security-headers.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $xinyue_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location ^~ /v1/ {
    proxy_pass http://backend:3100;
    proxy_http_version 1.1;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_intercept_errors off;
    add_header Cache-Control "no-store" always;
    add_header X-Accel-Buffering "no" always;
    include /etc/nginx/snippets/security-headers.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $xinyue_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  location = /admin {
    return 301 /admin/;
  }

  location /admin/ {
    try_files $uri $uri/ /admin/index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }
}
